<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Employee Sign In · Ace</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="login.css"><script src="login.js" defer></script></head>
<body data-role="employee"><main class="login-workspace"><section class="login-card"><p class="eyebrow">ACE FAMILY DENTAL</p><h1>Employee sign in</h1><form><label>Employee ID<input name="identifier" autocomplete="username" maxlength="80" required></label><label>Eight-digit PIN<input name="credential" type="password" autocomplete="current-password" inputmode="numeric" pattern="[0-9]{8}" minlength="8" maxlength="8" required></label><p id="login-error" class="login-error" role="alert"></p><button class="primary" type="submit">Sign In</button></form><a href="admin-login.html">Administrator sign in</a></section></main></body></html>
